<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meebo Audio Academy Terminal</title>
    <style>
        :root {
            --bg-main: #06060c;
            --bg-panel: #0d0d19;
            --accent-color: #0ebd84;
            --accent-hover: #0cb37d;
            --text-color: #f1f1f1;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        .terminal-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 5px;}
        .control-panel { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center;}
        select, button {
            background: #161626;
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
        }
        button.action-btn { background: var(--accent-color); color: #000; font-weight: bold; border: none; }
        button.action-btn:hover { background: var(--accent-hover); }
        button.danger-btn { border-color: #ff3366; color: #ff3366; }
        button.danger-btn:hover { background: rgba(255, 51, 102, 0.1); }
        button.listening { background: #ff3366; color: #fff; border: none; }
        
        .drop-zone {
            border: 2px dashed var(--accent-color);
            padding: 30px;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
            background: rgba(14, 189, 132, 0.05);
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .drop-zone:hover { background: rgba(14, 189, 132, 0.15); }
        
        #status-box {
            background: #161626;
            padding: 15px;
            border-left: 4px solid var(--accent-color);
            min-height: 60px;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .explorer-wrapper {
            background: #08080f;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            padding: 15px;
            margin-top: 15px;
        }
        .brain-node { margin: 6px 0; padding-left: 15px; border-left: 1px dotted rgba(14, 189, 132, 0.3); }
        .brain-key { color: var(--accent-color); font-weight: bold; cursor: pointer; user-select: none; }
        .brain-key:hover { text-shadow: 0 0 5px var(--accent-color); }
        .brain-values { display: none; color: #b5b5c8; font-size: 0.9em; margin-left: 10px; word-break: break-all; }
        .brain-node.expanded > .brain-values { display: block; }
    </style>
</head>
<body>

<div class="terminal-container">
    <h2>🧠 Meebo Cognitive Audio Academy + Profile Suite</h2>
    
    <div class="control-panel">
        <select id="brain-select"></select>
        <button id="rename-brain-btn">✏️ Rename</button>
        <button id="delete-brain-btn" class="danger-btn">❌ Delete</button>
        <button id="import-trigger-btn">📂 Import Profile</button>
        <input type="file" id="brain-upload" accept=".json" style="display: none;">
        <select id="mode-select">
            <option value="grammar">Grammar Engine (Proper)</option>
            <option value="chaotic">Chaotic Matrix (Random)</option>
        </select>
    </div>

    <div class="control-panel">
        <button id="mic-btn" class="action-btn">🎙️ Toggle Microphone Node</button>
        <button id="download-btn">💾 Export Active Brain</button>
        <button id="toggle-explorer-btn">🔍 Toggle Explorer View</button>
    </div>

    <div class="drop-zone" id="drop-zone">
        📂 Drop MP3, MP4, or WAV to teach Meebo or Click to select a file
        <input type="file" id="media-upload" accept="audio/*,video/*" style="display: none;">
    </div>

    <h4>Ingestion Output Stream:</h4>
    <div id="status-box">System Initialized. Awaiting pipeline broadcast packet...</div>

    <div class="explorer-wrapper" id="explorer-wrapper" style="display: block;">
        <div id="brain-explorer-container"></div>
    </div>
</div>

<!-- Script Execution Pipeline -->
<script src="academy-core.js"></script>
<script src="academy-audio.js"></script>
</body>
</html>
